<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Inkwell{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/">Inkwell</a>
      <nav class="nav">
        <a href="/">Stories</a>
        <a href="/authors">Authors</a>
        {% if user %}
          <a href="/dashboard">Dashboard</a>
          <a href="/new" class="btn btn-small">Write</a>
          <a href="/profile" class="avatar-link" title="{{ user.username }}">{{ user.username[0]|upper }}</a>
        {% else %}
          <a href="/login">Sign in</a>
          <a href="/register" class="btn btn-small">Get started</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="wrap main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>Inkwell</span>
      <span class="muted">Words worth keeping.</span>
    </div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
