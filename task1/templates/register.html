<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Securinets _ Register</title>
    <link rel="shortcut icon" href="/static/assets/favicon.png" type="image/png">
    <style>
        /* ===== Retro pixel font (bundled) ===== */
        @font-face {
            font-family: 'Mega Man 10';
            src: url('/static/assets/MegaMan10Regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg: #111;
            --fg: #E80032;
            --card-bg: #1a1a1a;
            --input-bg: #0d0d0d;
            --border: rgba(232, 0, 50, 0.3);
            --glow: rgba(232, 0, 50, 0.5);
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; margin: 0; }

        body {
            background-color: var(--bg);
            font-family: 'Mega Man 10', 'Courier New', monospace;
            color: var(--fg);
            font-size: 1rem;
            line-height: 1.6;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            overflow: hidden;
        }

        /* ===== Background effects ===== */
        .main-wrapper {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            height: 100vh;
        }

        .grid {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            width: 100%;
            height: 70vh;
            perspective: 56.25vh;
            opacity: 0.6;
        }

        .grid-lines {
            position: absolute;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 200%;
            background-image:
                linear-gradient(to right, rgba(232, 0, 50, 0.25) 1px, transparent 0),
                linear-gradient(to bottom, rgba(232, 0, 50, 0.25) 1px, transparent 0);
            background-size: 4vh 3vh;
            background-repeat: repeat;
            transform-origin: 100% 0 0;
            animation: play 30s linear infinite;
        }

        .grid-mask {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(180deg, var(--bg) 25%, transparent),
                radial-gradient(circle farthest-corner at 50% 0%, transparent 50%, var(--bg) 90%);
        }

        @keyframes play {
            0%   { transform: rotateX(45deg) translateY(-50%); }
            100% { transform: rotateX(45deg) translateY(0); }
        }

        .crt {
            position: fixed;
            inset: 0;
            z-index: 999;
            pointer-events: none;
        }

        .crt::after {
            content: " ";
            display: block;
            position: absolute;
            inset: 0;
            background: rgba(18, 16, 16, 0.3);
            opacity: 0;
            z-index: 2;
            pointer-events: none;
            animation: flicker 3s ease-in-out infinite;
        }

        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 6px 100%;
        }

        @keyframes flicker {
            0%   { opacity: 0.05; }
            20%  { opacity: 0.13; }
            40%  { opacity: 0.07; }
            60%  { opacity: 0.17; }
            80%  { opacity: 0.09; }
            100% { opacity: 0.05; }
        }

        /* ===== Auth Card ===== */
        .auth-card {
            position: relative;
            z-index: 10;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 40px var(--glow), inset 0 0 60px rgba(232, 0, 50, 0.05);
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .auth-logo {
            height: 6rem;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 0 12px var(--glow));
            animation: logoFloat 4s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }

        .auth-title {
            font-size: 1.75rem;
            font-weight: 400;
            margin: 0 0 0.5rem;
            text-shadow: 0 0 14px var(--glow);
            padding-left: 0.3em;
        }

        .auth-subtitle {
            font-size: 0.75rem;
            opacity: 0.7;
            margin: 0;
            padding-left: 0.3em;
        }

        .auth-error {
            background: rgba(232, 0, 50, 0.15);
            border: 1px solid var(--fg);
            color: var(--fg);
            padding: 0.75rem 1rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            font-size: 0.75rem;
            text-align: center;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.7rem;
            margin-bottom: 0.5rem;
            opacity: 0.8;
            padding-left: 0.3em;
        }

        .form-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.875rem 1rem;
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--fg);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--fg);
            box-shadow: 0 0 12px var(--glow);
        }

        .form-input::placeholder {
            color: rgba(232, 0, 50, 0.4);
        }

        .btn {
            width: 100%;
            background: transparent;
            border: 1px solid var(--fg);
            color: var(--fg);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 0.875rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, box-shadow 0.2s;
            margin-top: 0.5rem;
        }

        .btn:hover {
            background-color: var(--fg);
            color: var(--bg);
            box-shadow: 0 0 20px var(--glow);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.7rem;
            opacity: 0.7;
            padding-left: 0.3em;
        }

        .auth-footer a {
            color: var(--fg);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .auth-footer a:hover {
            border-bottom-color: var(--fg);
        }

        /* ===== Responsive ===== */
        @media screen and (max-width: 480px) {
            .auth-card {
                margin: 1rem;
                padding: 2rem 1.5rem;
            }
            .auth-logo { height: 5rem; }
            .auth-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="grid">
            <div class="grid-lines"></div>
        </div>
        <div class="grid-mask"></div>
        <div class="crt"></div>

        <div class="auth-card">
            <header class="auth-header">
                <svg class="auth-logo" viewBox="0 50 269 169" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Securinets">
                    <g fill="currentColor" transform="translate(0,180) scale(0.1,-0.1)">

                            c68,55,142,135,186,201c22,35,44,63,49,63s9-21,9-47c0-60-37-140-114-246c-31-43-56-80-56-83c0-9,66,30,108,65
                            c50,41,144,156,184,224c41,71,68,58,68-33c0-83-82-306-168-457c-21-38-41-76-45-85c-29-78,188,122,291,268c64,89,137,228,153,287
                            c4,18,18,66,29,107c27,92,37,276,21,375c-15,101-73,270-117,345c-43,74-117,156-184,204c-45,32-168,91-175,84c-2-2,9-31,25-65
                            c42-89,53-142,48-241c-5-102-23-145-84-209c-69-71-75-61-45,76c11,46,17,89,14,97c-2,7-37,26-76,42c-245,101-550,145-847,123

                            c4,104,7,118,40,190c22,45,32,77,25,77S487,1287,452,1270z"/>
                    </g>
                </svg>
                <h1 class="auth-title">New Recruit</h1>
                <p class="auth-subtitle">ウェブペンテスト / create account</p>
            </header>

            {% if error %}
                <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="post" action="/register">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" class="form-input" id="username" name="username" placeholder="choose username" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" class="form-input" id="email" name="email" placeholder="email address" autocomplete="email" required style="text-transform: none;">
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-input" id="password" name="password" placeholder="min 8 characters" autocomplete="new-password" required minlength="8">
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirm">Confirm Password</label>
                    <input type="password" class="form-input" id="confirm" name="confirm" placeholder="repeat password" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn">register</button>
            </form>

            <footer class="auth-footer">
                Already have access? <a href="/login">login</a>
            </footer>
        </div>
    </div>
</body>
</html>
