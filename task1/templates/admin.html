<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Securinets _ {{ 'Access Granted' if granted else 'Access Denied' }}</title>
    <link rel="shortcut icon" href="/static/assets/favicon.png" type="image/png">
    <style>
        /* ===== Retro pixel font (bundled) ===== */
        @font-face {
            font-family: 'Mega Man 10';
            src: url('/static/assets/MegaMan10Regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg: #111;
            --fg: #E80032;
            --deny: #E80032;
            --ok: #00E832;
            --card-bg: #1a1a1a;
            --border: rgba(232, 0, 50, 0.3);
            --border-ok: rgba(0, 232, 50, 0.35);
            --glow: rgba(232, 0, 50, 0.5);
            --glow-ok: rgba(0, 232, 50, 0.55);
        }

        * { box-sizing: border-box; }

        html, body { min-height: 100%; margin: 0; }

        body {
            background-color: var(--bg);
            font-family: 'Mega Man 10', 'Courier New', monospace;
            color: var(--fg);
            font-size: 1rem;
            line-height: 1.6;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* ===== Background effects (fixed, stays behind content) ===== */
        .grid {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            width: 100%;
            height: 70vh;
            perspective: 56.25vh;
            opacity: 0.6;
        }

        .grid-lines {
            position: absolute;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 200%;
            background-image:
                linear-gradient(to right, rgba(232, 0, 50, 0.25) 1px, transparent 0),
                linear-gradient(to bottom, rgba(232, 0, 50, 0.25) 1px, transparent 0);
            background-size: 4vh 3vh;
            background-repeat: repeat;
            transform-origin: 100% 0 0;
            animation: play 30s linear infinite;
        }

        .grid-mask {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(180deg, var(--bg) 25%, transparent),
                radial-gradient(circle farthest-corner at 50% 0%, transparent 50%, var(--bg) 90%);
        }

        @keyframes play {
            0%   { transform: rotateX(45deg) translateY(-50%); }
            100% { transform: rotateX(45deg) translateY(0); }
        }

        .crt {
            position: fixed;
            inset: 0;
            z-index: 999;
            pointer-events: none;
        }

        .crt::after {
            content: " ";
            display: block;
            position: absolute;
            inset: 0;
            background: rgba(18, 16, 16, 0.3);
            opacity: 0;
            z-index: 2;
            pointer-events: none;
            animation: flicker 3s ease-in-out infinite;
        }

        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 6px 100%;
        }

        @keyframes flicker {
            0%   { opacity: 0.05; }
            20%  { opacity: 0.13; }
            40%  { opacity: 0.07; }
            60%  { opacity: 0.17; }
            80%  { opacity: 0.09; }
            100% { opacity: 0.05; }
        }

        /* ===== Layout ===== */
        .main-wrapper {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
        }

        /* ===== Dashboard card ===== */
        .admin-card {
            --accent: var(--deny);
            --accent-glow: var(--glow);
            --accent-border: var(--border);
            position: relative;
            z-index: 10;
            background: var(--card-bg);
            border: 1px solid var(--accent-border);
            border-radius: 8px;
            padding: 3rem;
            width: 100%;
            max-width: 560px;
            text-align: center;
            box-shadow: 0 0 40px var(--accent-glow), inset 0 0 60px rgba(232, 0, 50, 0.05);
            animation: fadeIn 0.8s ease forwards;
        }

        .admin-card.granted {
            --accent: var(--ok);
            --accent-glow: var(--glow-ok);
            --accent-border: var(--border-ok);
            box-shadow: 0 0 46px var(--glow-ok), inset 0 0 60px rgba(0, 232, 50, 0.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== Animated lock ===== */
        .lock-stage {
            position: relative;
            width: 190px;
            height: 190px;
            margin: 0.5rem auto 1.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring {
            position: absolute;
            inset: 0;
            margin: auto;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 1px solid currentColor;
            opacity: 0;
        }

        .lock {
            position: relative;
            width: 118px;
            height: auto;
            display: block;
        }

        .lock .shackle path {
            fill: none;
            stroke: currentColor;
            stroke-width: 11;
            stroke-linecap: round;
        }

        .lock .body { fill: currentColor; }

        .lock .keyhole { fill: var(--card-bg); }

        .lock .shackle {
            transform-box: fill-box;
            transform-origin: 100% 100%;
        }

        /* --- Denied state: same lock, locked & red --- */
        .lock.is-closed {
            color: var(--deny);
            filter: drop-shadow(0 0 14px rgba(232, 0, 50, 0.55));
            animation: denyShake 0.5s ease 0.45s 2, denyPulse 2.6s ease-in-out 1.55s infinite;
        }

        .lock-stage.denied .ring {
            color: var(--deny);
            animation: ringPulse 1.6s ease-out 1.6s infinite;
        }

        @keyframes denyShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-7px); }
            40% { transform: translateX(7px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        @keyframes denyPulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.72; }
        }

        /* --- Granted state: shackle swings open & turns green --- */
        .lock.is-open {
            animation: grantTint 1.3s ease 0.35s both;
        }

        .lock.is-open .shackle {
            animation: unlock 1.05s cubic-bezier(0.34, 1.2, 0.4, 1) 0.7s both;
        }

        .lock-stage.granted .ring {
            color: var(--ok);
            animation: ringPulse 1.1s ease-out 0.6s 2;
        }

        .lock-stage.granted .ring::after {
            content: "";
            position: absolute;
            inset: 16px;
            border-radius: 50%;
            border: 1px solid currentColor;
        }

        @keyframes grantTint {
            0%, 40% {
                color: var(--deny);
                filter: drop-shadow(0 0 14px rgba(232, 0, 50, 0.55));
            }
            100% {
                color: var(--ok);
                filter: drop-shadow(0 0 22px rgba(0, 232, 50, 0.75));
            }
        }

        @keyframes unlock {
            0%   { transform: translateY(0) rotate(0deg); }
            55%  { transform: translateY(-4px) rotate(5deg); }
            100% { transform: translateY(-18px) rotate(-22deg); }
        }

        @keyframes ringPulse {
            0%   { opacity: 0.85; transform: scale(0.62); }
            100% { opacity: 0; transform: scale(1.18); }
        }

        /* ===== Status text ===== */
        .status {
            font-size: 1.75rem;
            font-weight: 400;
            margin: 0 0 0.4rem;
            padding-left: 0.3em;
            letter-spacing: 0.12em;
            color: var(--accent);
            animation: fadeIn 0.6s ease 0.9s both;
        }

        .status-granted { text-shadow: 0 0 18px var(--glow-ok); }
        .status-denied  { text-shadow: 0 0 18px var(--glow); animation-delay: 0.55s; }

        .status-jp {
            font-size: 0.8rem;
            opacity: 0.7;
            margin: 0 0 1.75rem;
            padding-left: 0.3em;
            animation: fadeIn 0.6s ease 1s both;
        }

        /* ===== Flag ===== */
        .flag-box {
            position: relative;
            overflow: hidden;
            background: rgba(0, 232, 50, 0.06);
            border: 1px solid var(--border-ok);
            border-radius: 6px;
            padding: 1.25rem 1rem;
            margin: 0 0 1.5rem;
            box-shadow: inset 0 0 26px rgba(0, 232, 50, 0.08);
            animation: flagReveal 0.9s ease 1.15s both;
        }

        .flag-label {
            display: block;
            font-size: 0.6rem;
            letter-spacing: 0.3em;
            opacity: 0.7;
            margin-bottom: 0.6rem;
            padding-left: 0.3em;
        }

        .flag {
            display: block;
            font-family: inherit;
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            color: var(--ok);
            word-break: break-all;
            text-shadow: 0 0 12px var(--glow-ok);
        }

        /* sweeping decrypt scan */
        .flag-box .scan {
            position: absolute;
            top: 0;
            bottom: 0;
            left: -45%;
            width: 45%;
            pointer-events: none;
            background: linear-gradient(90deg, transparent, rgba(0, 232, 50, 0.28), transparent);
            animation: scan 2.6s ease-in-out 2.1s infinite;
        }

        @keyframes flagReveal {
            from { clip-path: inset(0 100% 0 0); }
            to   { clip-path: inset(0 0 0 0); }
        }

        @keyframes scan {
            0%   { left: -45%; }
            65%  { left: 120%; }
            100% { left: 120%; }
        }

        .hint {
            font-size: 0.7rem;
            opacity: 0.7;
            margin: 0 0 1.75rem;
            padding-left: 0.3em;
            animation: fadeIn 0.6s ease 1.3s both;
        }

        .hint-ok { color: var(--ok); opacity: 0.85; }

        /* ===== Buttons ===== */
        .btn-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            background-color: var(--accent);
            color: var(--bg);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* ===== Responsive ===== */
        @media screen and (max-width: 480px) {
            .admin-card { padding: 2rem 1.5rem; }
            .status { font-size: 1.4rem; }
            .lock-stage { width: 160px; height: 160px; }
            .lock { width: 96px; }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="grid">
        <div class="grid-lines"></div>
    </div>
    <div class="grid-mask"></div>
    <div class="crt"></div>

    <div class="main-wrapper">
        <div class="admin-card {{ 'granted' if granted else 'denied' }}">
            <div class="lock-stage {{ 'granted' if granted else 'denied' }}">
                <div class="ring"></div>
                <div class="ring"></div>
                <!-- Same padlock in both states; the shackle animates open only when granted -->
                <svg class="lock {{ 'is-open' if granted else 'is-closed' }}" viewBox="0 0 120 160"
                     xmlns="http://www.w3.org/2000/svg" role="img"
                     aria-label="{{ 'unlocked padlock' if granted else 'locked padlock' }}">
                    <g class="shackle">
                        <path d="M36 78 V46 a24 24 0 0 1 48 0 V78"/>
                    </g>
                    <rect class="body" x="18" y="72" width="84" height="70" rx="12"/>
                    <circle class="keyhole" cx="60" cy="100" r="8"/>
                    <rect class="keyhole" x="55" y="104" width="10" height="20" rx="4"/>
                </svg>
            </div>

            {% if granted %}
                <h1 class="status status-granted">Access Granted</h1>
                <p class="status-jp">アクセス許可 / root clearance</p>

                <div class="flag-box">
                    <span class="flag-label">flag</span>
                    <code class="flag">{{ flag }}</code>
                    <div class="scan"></div>
                </div>

                <p class="hint hint-ok">role elevated to <b>admin</b> — welcome, {{ user["username"] }}.</p>
            {% else %}
                <h1 class="status status-denied">Access Denied</h1>
                <p class="status-jp">アクセス拒否 / clearance required</p>

                <p class="hint">insufficient clearance. this console requires the <b>admin</b> role.</p>
            {% endif %}

            <div class="btn-group">
                <a href="/profile" class="btn">profile</a>
                <a href="/" class="btn">briefing</a>
            </div>
        </div>
    </div>
</body>
</html>
