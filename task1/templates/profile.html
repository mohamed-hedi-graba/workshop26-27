<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Securinets _ Profile</title>
    <link rel="shortcut icon" href="/static/assets/favicon.png" type="image/png">
    <style>
        /* ===== Retro pixel font (bundled) ===== */
        @font-face {
            font-family: 'Mega Man 10';
            src: url('/static/assets/MegaMan10Regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg: #111;
            --fg: #E80032;
            --card-bg: #1a1a1a;
            --border: rgba(232, 0, 50, 0.3);
            --glow: rgba(232, 0, 50, 0.5);
            --muted: rgba(232, 0, 50, 0.6);
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; margin: 0; }

        body {
            background-color: var(--bg);
            font-family: 'Mega Man 10', 'Courier New', monospace;
            color: var(--fg);
            font-size: 1rem;
            line-height: 1.6;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            overflow: hidden;
        }

        /* ===== Background effects ===== */
        .main-wrapper {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            height: 100vh;
            padding: 2rem;
        }

        .grid {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            width: 100%;
            height: 70vh;
            perspective: 56.25vh;
            opacity: 0.6;
        }

        .grid-lines {
            position: absolute;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 200%;
            background-image:
                linear-gradient(to right, rgba(232, 0, 50, 0.25) 1px, transparent 0),
                linear-gradient(to bottom, rgba(232, 0, 50, 0.25) 1px, transparent 0);
            background-size: 4vh 3vh;
            background-repeat: repeat;
            transform-origin: 100% 0 0;
            animation: play 30s linear infinite;
        }

        .grid-mask {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(180deg, var(--bg) 25%, transparent),
                radial-gradient(circle farthest-corner at 50% 0%, transparent 50%, var(--bg) 90%);
        }

        @keyframes play {
            0%   { transform: rotateX(45deg) translateY(-50%); }
            100% { transform: rotateX(45deg) translateY(0); }
        }

        .crt {
            position: fixed;
            inset: 0;
            z-index: 999;
            pointer-events: none;
        }

        .crt::after {
            content: " ";
            display: block;
            position: absolute;
            inset: 0;
            background: rgba(18, 16, 16, 0.3);
            opacity: 0;
            z-index: 2;
            pointer-events: none;
            animation: flicker 3s ease-in-out infinite;
        }

        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 6px 100%;
        }

        @keyframes flicker {
            0%   { opacity: 0.05; }
            20%  { opacity: 0.13; }
            40%  { opacity: 0.07; }
            60%  { opacity: 0.17; }
            80%  { opacity: 0.09; }
            100% { opacity: 0.05; }
        }

        /* ===== Profile Card ===== */
        .profile-card {
            position: relative;
            z-index: 10;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 3rem;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 0 40px var(--glow), inset 0 0 60px rgba(232, 0, 50, 0.05);
            animation: fadeIn 0.8s ease forwards;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .profile-header {
            margin-bottom: 2.5rem;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--fg);
            background: var(--bg);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 20px var(--glow);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px var(--glow); }
            50% { box-shadow: 0 0 30px var(--glow), 0 0 40px var(--glow); }
        }

        .profile-avatar svg {
            width: 48px;
            height: 48px;
        }

        .profile-name {
            font-size: 1.75rem;
            font-weight: 400;
            margin: 0 0 0.5rem;
            text-shadow: 0 0 14px var(--glow);
            padding-left: 0.3em;
        }

        .profile-role {
            font-size: 0.75rem;
            opacity: 0.7;
            margin: 0 0 1rem;
            padding-left: 0.3em;
        }

        .profile-badge {
            display: inline-block;
            background: var(--fg);
            color: var(--bg);
            font-size: 0.6rem;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            letter-spacing: 0.2em;
        }

        .profile-details {
            background: rgba(232, 0, 50, 0.05);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-size: 0.7rem;
            opacity: 0.7;
            padding-left: 0.3em;
        }

        .detail-value {
            font-size: 0.8rem;
            font-family: inherit;
            letter-spacing: 0.1em;
            word-break: break-all;
        }

        .btn {
            background: transparent;
            border: 1px solid var(--fg);
            color: var(--fg);
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, box-shadow 0.2s;
            margin: 0 0.5rem;
        }

        .btn:hover {
            background-color: var(--fg);
            color: var(--bg);
            box-shadow: 0 0 20px var(--glow);
        }

        .btn-danger {
            border-color: var(--fg);
            color: var(--fg);
        }

        .btn-danger:hover {
            background-color: var(--fg);
            color: var(--bg);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        /* ===== Responsive ===== */
        @media screen and (max-width: 480px) {
            .profile-card {
                margin: 1rem;
                padding: 2rem 1.5rem;
            }
            .profile-name { font-size: 1.5rem; }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; margin: 0; }
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="grid">
            <div class="grid-lines"></div>
        </div>
        <div class="grid-mask"></div>
        <div class="crt"></div>

        <div class="profile-card">

                    </svg>
                </div>
                <h1 class="profile-name">{{ user["username"] }}</h1>
                <p class="profile-role">ウェブペンテスト / workshop participant</p>
                <span class="profile-badge">authorized</span>
            </header>

            <section class="profile-details">
                <div class="detail-row">
                    <span class="detail-label">USERNAME</span>
                    <span class="detail-value">{{ user["username"] }}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">EMAIL</span>
                    <span class="detail-value">{{ user["email"] }}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">REGISTERED</span>
                    <span class="detail-value">{{ user["created_at"] }}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">USER ID</span>
                    <span class="detail-value">#{{ user["id"] }}</span>
                </div>
            </section>

            <div class="btn-group">
                <form action="/logout" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-danger">logout</button>
                </form>
                <a href="/" class="btn">back to briefing</a>
            </div>
        </div>
    </div>
</body>
</html>
