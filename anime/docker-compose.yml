version: '3.8'

services:
  php-apache:
    build: .
    ports:
      - "5007:80"
    volumes:
      - .:/var/www/html
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
      - FLAG=Securinets{JK_sa1T4mA_sol0s_Ur_Vers3}
    restart: unless-stopped
    networks:
      - anime-battle-network

networks:
  anime-battle-network:
    driver: bridge
